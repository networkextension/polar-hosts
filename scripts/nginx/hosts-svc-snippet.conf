# nginx snippet — routes /api/hosts/* + /api/agents/* (token CRUD)
# + /ws/host/* + /ws/agent (polar-agent WS attach) to hosts-svc (:8095).
# Pair with POLAR_HOSTS_REMOTE=true.
#
# WebSocket upgrades require the proxy_set_header Upgrade/Connection
# pair; keep Connection "upgrade" hard-coded (not $http_connection)
# so cancelled WS upgrades from the browser don't propagate weird
# trailer states upstream.

location ~ ^/api/(hosts|agents|console-layouts)/ {
    proxy_pass http://127.0.0.1:8095;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
}

# polar-agent attach + per-host shell/VNC WebSocket bridges
location ~ ^/ws/(host|agent) {
    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    # Long-lived sessions — no read-timeout disconnects mid-shell.
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# polar-agent install script + binary download (curl|bash flow).
# Unauthenticated at the gin layer — token-gated inside the handler.
location ~ ^/agent/(install|binary) {
    proxy_pass http://127.0.0.1:8095;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    # polar-agent binary is ~30MB; bump just in case.
    client_max_body_size 100m;
    proxy_read_timeout 300s;
}
